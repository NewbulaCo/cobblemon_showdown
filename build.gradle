plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // required so processResources runs against IDE output before launching
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            jvmArg '-Xmx2G'
            jvmArg '-Xms2G'

            // java 17+ module access required for forge/mixin/cobblemon reflection in dev runs
            jvmArg '--add-opens=java.base/java.lang=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.util=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.io=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.nio=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.net=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.text=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/java.util.jar=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/sun.nio.fs=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/sun.security.util=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED'
            jvmArg '--add-opens=java.base/jdk.internal.math=ALL-UNNAMED'
            jvmArg '--add-opens=jdk.naming.dns/com.sun.jndi.dns=ALL-UNNAMED'
            jvmArg '--add-exports=java.base/sun.security.util=ALL-UNNAMED'
            jvmArg '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED'
            jvmArg '--add-exports=java.base/jdk.internal.reflect=ALL-UNNAMED'
            jvmArg '--add-exports=jdk.naming.dns/com.sun.jndi.dns=ALL-UNNAMED'
            jvmArg '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED'

            jvmArg '-Dnet.minecraftforge.fml.ignoreInvalidMinecraftCertificates=true'
            jvmArg '-Dfml.earlyprogresswindow=false'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// include resources produced by the data generators
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }            // kotlin for forge (cobblemon)
    maven { url = "https://maven.impactdev.net/repository/development/" }        // cobblemon
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }  // geckolib
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // required for the cobblemon dependency
    implementation "thedarkcolour:kotlinforforge:4.3.0"

    // compileOnly only: cobblemon's mixins use SRG names that clash with parchment in dev.
    // it is present at runtime in production.
    compileOnly fg.deobf("com.cobblemon:forge:${cobblemon_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// expands ${} placeholders in mods.toml/pack.mcmeta from the gradle.properties values
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "mixins.${mod_id}.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
